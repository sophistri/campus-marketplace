services:
  database:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # fake SMTP server with a web inbox, so signup works without a real mail account
  mailpit:
    image: axllent/mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "8025:8025"

  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://database:27017/campus-marketplace
      CLIENT_URL: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      ALLOWED_EMAIL_DOMAINS: example.edu
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USER: dev
      SMTP_PASS: dev
      SMTP_FROM: Campus Marketplace <noreply@campus.local>
    depends_on:
      database:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - server_uploads:/app/uploads

  client:
    build: ./client
    ports:
      - "5173:80"
    environment:
      API_URL: http://localhost:5000/api

volumes:
  mongo_data:
  server_uploads: